name: "Claude Action"
description: "General-purpose Claude agent for GitHub PRs and issues. Can answer questions and implement simple code changes."

inputs:
  repository:
    description: "The GitHub repository in owner/repo format"
    required: true
  pr_number:
    description: "The pull request number or issue number"
    required: true
  comment_id:
    description: "The comment ID to respond to"
    required: false
  issue_body:
    description: "The issue body to check for trigger phrase"
    required: false
  assignee_username:
    description: "The assignee username from the event"
    required: false
  assignee_trigger:
    description: "The assignee username that triggers the action (e.g. @claude)"
    required: false
  trigger_username:
    description: "The GitHub username of the person who triggered this action (for PR co-authorship)"
    required: true
  trigger_phrase:
    description: "The trigger phrase to look for in comments or issue body"
    required: false
    default: "@claude"
  timeout_minutes:
    description: "Timeout in minutes for execution"
    required: false
    default: "30"
  anthropic_api_key:
    description: "Anthropic API key"
    required: true
  github_token:
    description: "GitHub token with repo and pull request permissions"
    required: true
  allowed_tools:
    description: "Additional tools for Claude to use (the base GitHub tools will always be included)"
    required: false
    default: ""
  disallowed_tools:
    description: "Tools that Claude should never use"
    required: false
    default: ""
  custom_instructions:
    description: "Additional custom instructions to include in the prompt for Claude"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Get OIDC Token and Exchange for App Token
      id: get-app-token
      shell: bash
      run: |
        echo "Requesting OIDC token..."
        RESPONSE=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=claude-code-github-action")

        echo "OIDC response received, extracting token..."
        OIDC_TOKEN=$(echo "$RESPONSE" | jq -r '.value // .')

        if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" == "null" ]; then
          echo "Failed to get OIDC token. Response: $RESPONSE"
          exit 1
        fi

        echo "OIDC token successfully obtained, exchanging for app token..."
        # Exchange OIDC token for app token
        APP_TOKEN_RESPONSE=$(curl -s -X POST \
          -H "Authorization: Bearer $OIDC_TOKEN" \
          "https://api.anthropic.com/api/github/github-app-token-exchange")

        echo "App token exchange response received, extracting token..."
        APP_TOKEN=$(echo "$APP_TOKEN_RESPONSE" | jq -r '.token // .app_token // empty')

        if [ -z "$APP_TOKEN" ]; then
          echo "Failed to get app token. Response: $APP_TOKEN_RESPONSE"
          exit 1
        fi

        echo "App token successfully obtained"
        echo "APP_TOKEN=$APP_TOKEN" >> $GITHUB_OUTPUT

    - name: Set GitHub Token
      id: set-token
      shell: bash
      run: |
        echo "GITHUB_TOKEN=${{ steps.get-app-token.outputs.APP_TOKEN }}" >> $GITHUB_ENV

    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.2.11

    - name: Install Dependencies
      shell: bash
      run: |
        cd ${{ github.action_path }}
        bun install

    - name: Check for trigger conditions
      id: check-trigger
      shell: bash
      run: |
        cd ${{ github.action_path }}
        bun run ./src/check-trigger.ts
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_ACTION: ${{ github.event.action }}
        ASSIGNEE_TRIGGER: ${{ inputs.assignee_trigger }}
        ASSIGNEE_USERNAME: ${{ inputs.assignee_username }}
        TRIGGER_PHRASE: ${{ inputs.trigger_phrase }}
        ISSUE_BODY: ${{ inputs.issue_body }}
        COMMENT_BODY: ${{ github.event.comment.body }}

    - name: Check if actor is a human
      shell: bash
      run: |
        ACTOR_TYPE=$(gh api users/${{ github.actor }} --jq '.type')
        echo "Actor type: $ACTOR_TYPE"

        if [ "$ACTOR_TYPE" != "User" ]; then
          echo "Workflow initiated by non-human actor: ${{ github.actor }} (type: $ACTOR_TYPE)."
          exit 1
        fi
      env:
        GH_TOKEN: ${{ env.GITHUB_TOKEN }}

    - name: Post initial comment for tracking
      if: steps.check-trigger.outputs.contains_trigger == 'true'
      id: initial-comment
      uses: actions/github-script@v7
      with:
        github-token: ${{ env.GITHUB_TOKEN }}
        script: |
          const spinnerHtml = '<img src="https://github.com/user-attachments/assets/5ac382c7-e004-429b-8e35-7feb3e8f9c6f" width="14px" height="14px" style="vertical-align: middle; margin-left: 4px;" />';

          try {
            let response;
            // Only use createReplyForReviewComment if it's a PR review comment AND we have a comment_id
            const commentId = '${{ inputs.comment_id }}';
            if (context.eventName === 'pull_request_review_comment' && commentId && commentId !== '') {
              response = await github.rest.pulls.createReplyForReviewComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: ${{ inputs.pr_number }},
                comment_id: parseInt(commentId),
                body: `Claude Code is working… ${spinnerHtml}\n\n**Here's what I'll do:**\n- [ ] Gather issue and comment context\n- [ ] Analyze the PR  \n- [ ] Create pull request\n- [ ] Verify lint passes\n- [ ] Verify tests pass`
              });
            } else {
              // For all other cases (issues, issue comments, or missing comment_id)
              response = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ inputs.pr_number }},
                body: `Claude Code is working… ${spinnerHtml}\n\n**Here's what I'll do:**\n- [ ] Gather issue and comment context\n- [ ] Analyze the PR  \n- [ ] Create pull request\n- [ ] Verify lint passes\n- [ ] Verify tests pass`
              });
            }
            core.setOutput('claude_comment_id', response.data.id);
          } catch (error) {
            console.error('Error in initial comment:', error);
            // Always fall back to regular issue comment if anything fails
            try {
              const response = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: ${{ inputs.pr_number }},
                body: `Claude Code is working… ${spinnerHtml}\n\n**Here's what I'll do:**\n- [ ] Gather issue and comment context\n- [ ] Analyze the PR  \n- [ ] Create pull request\n- [ ] Verify lint passes\n- [ ] Verify tests pass`
              });
              core.setOutput('claude_comment_id', response.data.id);
            } catch (fallbackError) {
              console.error('Fatal error in fallback comment creation:', fallbackError);
              core.setFailed('Failed to create comment');
            }
          }

    - name: Create prompt file
      if: steps.check-trigger.outputs.contains_trigger == 'true'
      shell: bash
      run: |
        cd ${{ github.action_path }}
        bun run ./src/create-prompt.ts
      env:
        REPOSITORY: ${{ inputs.repository }}
        PR_NUMBER: ${{ inputs.pr_number }}
        COMMENT_ID: ${{ inputs.comment_id }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_ACTION: ${{ github.event.action }}
        TRIGGER_PHRASE: ${{ inputs.trigger_phrase }}
        ASSIGNEE_TRIGGER: ${{ inputs.assignee_trigger }}
        TRIGGER_USERNAME: ${{ inputs.trigger_username }}
        CLAUDE_COMMENT_ID: ${{ steps.initial-comment.outputs.claude_comment_id }}
        CUSTOM_INSTRUCTIONS: ${{ inputs.custom_instructions }}
        ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
        DISALLOWED_TOOLS: ${{ inputs.disallowed_tools }}

    - name: Install GitHub MCP Server
      shell: bash
      run: |
        cd ${{ github.action_path }}
        bun run ./src/install-mcp-server.ts
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

    - name: Run Claude Code
      if: steps.check-trigger.outputs.contains_trigger == 'true'
      uses: ./.github/actions/claude-code-action
      with:
        prompt_file: /tmp/claude-prompts/claude-prompt.txt
        allowed_tools: ${{ env.ALLOWED_TOOLS }}
        disallowed_tools: ${{ env.DISALLOWED_TOOLS }}
        timeout_minutes: ${{ inputs.timeout_minutes }}
        anthropic_model: ${{ inputs.anthropic_model }}
        mcp_config: /tmp/mcp_config.json
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}

    - name: Revoke app token
      if: always()
      shell: bash
      run: |
        curl -L \
          -X DELETE \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ env.GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/installation/token
