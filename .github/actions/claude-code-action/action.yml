name: "Claude Code Action"
description: "Run Claude Code in GitHub Actions workflows"

inputs:
  prompt:
    description: "The prompt to send to Claude Code"
    required: false
    default: ""
  prompt_file:
    description: "Path to a file containing the prompt to send to Claude Code"
    required: false
    default: ""
  allowed_tools:
    description: "Comma-separated list of allowed tools for Claude Code to use"
    required: false
    default: ""
  disallowed_tools:
    description: "Comma-separated list of disallowed tools that Claude Code cannot use"
    required: false
    default: ""
  output_file:
    description: "File to save Claude Code output to (optional)"
    required: false
    default: ""
  timeout_minutes:
    description: "Timeout in minutes for Claude Code execution"
    required: false
    default: "10"
  max_turns:
    description: "Maximum number of conversation turns (default: no limit)"
    required: false
    default: ""
  mcp_config:
    description: "Path to the MCP configuration JSON file"
    required: false
    default: ""
  use_node_cache:
    description: "Whether to use Node.js dependency caching (set to true only for Node.js projects with lock files)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "18.x"
        cache: ${{ inputs.use_node_cache == 'true' && 'npm' || '' }}

    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.2.11

    - name: Install Dependencies
      shell: bash
      run: |
        cd ${{ github.action_path }}
        bun install

    - name: Install Claude Code
      shell: bash
      run: npm install -g @anthropic-ai/claude-code

    - name: Check Claude Code version
      shell: bash
      run: claude -v

    - name: Prepare Prompt File
      shell: bash
      id: prepare_prompt
      run: |
        bun run ${{ github.action_path }}/src/prepare-prompt.ts
      env:
        INPUT_PROMPT: ${{ inputs.prompt }}
        INPUT_PROMPT_FILE: ${{ inputs.prompt_file }}

    - name: Run Claude Code
      shell: bash
      id: run_claude
      run: |
        bun run ${{ github.action_path }}/src/run-claude.ts
      env:
        ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
        INPUT_ANTHROPIC_MODEL: ${{ inputs.anthropic_model }}
        INPUT_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        INPUT_OUTPUT_FILE: ${{ inputs.output_file }}
        INPUT_ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
        INPUT_DISALLOWED_TOOLS: ${{ inputs.disallowed_tools }}
        INPUT_MAX_TURNS: ${{ inputs.max_turns }}
        INPUT_MCP_CONFIG: ${{ inputs.mcp_config }}
