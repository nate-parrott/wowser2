name: Claude PR Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude PR Agent
        uses: ./.github/actions/claude-pr-action
        with:
          repository: ${{ github.repository }}
          pr_number: ${{ github.event.issue.number || github.event.pull_request.number }}
          comment_id: ${{ github.event.comment.id }}
          issue_body: ${{ github.event.issue.body }}
          assignee_username: ${{ github.event.issue.assignee.login || github.event.assignee.login }}
          trigger_username: ${{ github.event.comment.user.login || github.event.issue.user.login || github.event.pull_request.user.login || github.event.sender.login || github.triggering_actor || github.actor || '' }}
          timeout_minutes: "60"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_tools: "Bash(npm install),Bash(npm run build),Bash(npm run lint),Bash(npm run test)"
          custom_instructions: "You have also been granted tools for editing files and running npm commands (install, build, lint, test) for testing your changes."
