<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; cursor: pointer; }
</style>
<canvas id="c"></canvas>
<script>
  // Runs in a transparent web view inside the browser's chrome.
  // `wowser` is the bridge to the component that placed this island.
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let props = { color: "#0a84ff", busy: false };
  if (window.wowser) wowser.onProps((p) => { if (p) props = p; });
  canvas.addEventListener("click", () => window.wowser && wowser.post({ type: "tap" }));

  function frame(t) {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== w * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const speed = props.busy ? 0.006 : 0.0015;
    const r = Math.min(w, h) / 2 - 3;
    for (let i = 0; i < 3; i++) {
      const a = t * speed + (i * Math.PI * 2) / 3;
      const pulse = props.busy ? 0.75 + 0.25 * Math.sin(t * 0.01 + i) : 1;
      ctx.beginPath();
      ctx.arc(w / 2 + Math.cos(a) * r * 0.35, h / 2 + Math.sin(a) * r * 0.35, r * 0.55 * pulse, 0, Math.PI * 2);
      ctx.fillStyle = props.color;
      ctx.globalAlpha = 0.45;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
